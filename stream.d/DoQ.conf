#Logging-Format (ohne SNI-Variablen)
log_format doq_logs '$remote_addr [$time_local] '
                    '$protocol $status $bytes_sent $bytes_received '
                    '$session_time $upstream_addr';

# Rate-Limiting Zone (eigener Name, damit sie nicht mit dot_conn_limit kollidiert)
limit_conn_zone $binary_remote_addr zone=doq_conn_limit:10m;

# Upstream: AdGuard Home DoQ (IPv4 + IPv6)
upstream doq_backend {
    # Sticky pro Client-IP: eine QUIC-Verbindung muss während ihrer
    # gesamten Lebensdauer beim selben Backend landen.
    hash $remote_addr consistent;

    server 192.168.1.28:1852;
    server [fdf5:a5cc:270:0:be24:11ff:fecd:5693]:1852;
}

# DoQ-Server auf UDP 853 (läuft parallel zu DoT auf TCP 853)
server {
    listen 853 udp reuseport;
    listen [::]:853 udp reuseport;

    proxy_pass doq_backend;

    # Rate-Limiting (gleichzeitige UDP-Sessions pro Client)
    limit_conn doq_conn_limit 20;

    # Timeouts
    proxy_connect_timeout 5s;
    proxy_timeout 30s;      # Idle-Timeout einer UDP-Session

    # WICHTIG: proxy_responses NICHT setzen (nicht auf 1!).
    # QUIC braucht mehrere Antwort-Datagramme (Handshake etc.).

    # Logging
    access_log /var/log/nginx/doq_access.log doq_logs;
    error_log  /var/log/nginx/doq_error.log warn;
}
