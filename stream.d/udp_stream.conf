# 1. Logging-Format definieren (Muss HIER stehen, da es im Stream-Block enthalten ist)
log_format udp_logs '$remote_addr [$time_local] '
                    '$protocol $status $bytes_sent $bytes_received '
                    '$session_time $upstream_addr';


# 2. Upstream definieren
upstream wg_backend {
    # Ziel: Der Backend-Server, der auf UDP/63218 lauscht
    server 192.168.178.25:63218;
}

# 3. Server-Block für UDP-Proxy (Port 63218)
server {
    listen 63218 udp;

    # Weiterleitung an den Upstream-Server
    proxy_pass wg_backend;

    # 4. Access Logging aktivieren
    access_log /var/log/nginx/udp_63218_access.log udp_logs;

    # Timeouts für UDP-Verbindungen
    proxy_timeout 30s;
}
