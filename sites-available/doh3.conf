upstream doh_backend {
    server 192.168.1.28:8443;
    server [fdf5:a5cc:270:0:be24:11ff:fecd:5693]:8443;
    keepalive 32;
}

server {
    # TCP (HTTP/1.1 + HTTP/2)
    listen 192.168.1.55:443 ssl;
    listen [::]:443 ssl;

    # UDP (HTTP/3 / QUIC); reuseport nur EINMAL pro IP:Port-Kombi
    listen 443 quic;
    listen [::]:443 quic;

    http2 on;
    http3 on;
    quic_retry on;

    # optional, wenn NIC/Kernel es unterstützen:
    quic_gso on;

    server_name doh.mydomain.xyz;

    # TLS
    ssl_certificate     /var/lib/acme/doh.mydomain.xyz.crt;
    ssl_certificate_key /var/lib/acme/doh.mydomain.xyz.key;

    # QUIC erfordert TLS 1.3
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_early_data      off;   # 0-RTT bewusst aus (Replay-Risiko)

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /home/nginx/.acme.sh/doh.mydomain.xyz_ecc/ca.cer;

    resolver 9.9.9.9 valid=300s;
    resolver_timeout 2s;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Alt-Svc auf Server-Ebene, damit JEDE Antwort (auch Fehler/Health) HTTP/3 ankündigt
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # Logging
    access_log off;
    error_log  /var/log/nginx/doh_error.log warn;   # "debug" nur zum Testen

    client_max_body_size 1m;
    keepalive_timeout 10;

    limit_conn doh_conn 7;
    limit_req  zone=doh_limit burst=45 nodelay;
    limit_req_status 429;

    # DoH-Endpoint
    location ~ ^/dns-query(/.*)?$ {
        # Variable + Regex-Location: Pfad explizit mit $request_uri durchreichen
        proxy_pass https://doh_backend$request_uri;

## doh conifg doh.mydomain.xyz/dns-query/[random key]
## head -c 16 /dev/urandom | base32 | tr A-Z a-z | tr -d '='
## dies dann in adguard bei dem entsprechenden clients eingeben

        # Wichtig: add_header in location überschreibt die vom server-Block!
        # Daher hier alles erneut setzen:
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";          # nötig für keepalive zum Upstream
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Accept/Content-Type NICHT überschreiben: GET (?dns=...) hat keinen Body,
        # und Clients senden die Header ohnehin korrekt.

        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        # proxy_ssl_verify on;                    # falls Backend gültiges Zertifikat hat
        # proxy_ssl_trusted_certificate /pfad/ca.pem;

        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
        proxy_send_timeout    5s;
        proxy_buffering off;                      # DNS-Antworten sind klein, geringere Latenz

        limit_conn doh_conn 5;
        limit_req  zone=doh_limit burst=30 nodelay;
        limit_req_status 429;
    }

    location = /health {
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        return 204;
    }

    # Alles andere abweisen
    location / {
        return 404;
    }
}
