server {
    listen 192.168.3.55:80;
    server_name local.dynDns.de;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 192.168.3.55:443 ssl;
    http2 on;
    server_name local.dynDns.de;

    # Zertifikatspfade
    ssl_certificate /var/lib/acme/local.dynDns.de.crt;
    ssl_certificate_key /var/lib/acme/local.dynDns.de.key;

    # Access List
    allow 1.2.3.4; # DYN_IP
    allow 2a02:3100::[MAC-Adress]; # DYN_IP_V6
    deny all;


    location / {
        proxy_pass http://192.168.3.10:1411;

        # Header-Weitergabe
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
