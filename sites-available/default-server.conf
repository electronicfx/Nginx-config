server {
    listen 192.168.1.55:80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/default-access.log json_loki;
    return 444;
}

server {
    listen 192.168.1.55:443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 192.168.1.55:443 quic default_server;
    listen [::]:443 quic default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log /var/log/nginx/default-access.log json_loki;
    return 444;
}
