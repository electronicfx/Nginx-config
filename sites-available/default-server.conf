# Default catch-all Server (für alle unbekannten Domains)
map $http_user_agent $is_bot {
    default 0;
    ~*bot 1;
    ~*crawler 1;
    ~*spider 1;
    ~*scraper 1;
    ~*googlebot 1;
    ~*bingbot 1;
    ~*slurp 1;
    ~*duckduckbot 1;
    ~*facebookexternalhit 1;
    ~*twitterbot 1;
    ~*linkedinbot 1;
    ~*whatsapp 1;
    ~*telegram 1;
    ~*ahrefsbot 1;
    ~*mj12bot 1;
    ~*semrushbot 1;
    ~*dotbot 1;
    ~*petalbot 1;
    ~*yandexbot 1;
    ~*baiduspider 1;
    ~*bingpreview 1;
    ~*python-requests 1;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate  /etc/nginx/ssl/my-domain.xyz.crt;
    ssl_certificate_key  /etc/nginx/ssl/my-domain.xyz.key;

    access_log /var/log/nginx/default-access.log;
    error_log /var/log/nginx/default-error.log;

    return 444;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    access_log /var/log/nginx/default.access.log;

    if ($is_bot) {
        return 301 https://ash.speed.hetzner.de/10GB.bin;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

server {
    listen 443 ssl; 
    http2 on;
    server_name localhost 127.0.0.1;

    ssl_certificate     /etc/nginx/ssl/my-domain.xyz.crt;
    ssl_certificate_key /etc/nginx/ssl/my-domain.xyz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/default.access.log;

    if ($is_bot) {
        return 301 https://speed.hetzner.de/10GB.bin;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
