# 1. HTTP zu HTTPS Redirect (Standardmäßig auf Port 80)
server {
    listen 80; 
    server_name grafana.local.my-domain.xyz;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Der eigentliche HTTPS Proxy
server {
    listen 443 ssl;
    http2 on;
    server_name grafana.local.my-domain.xyz;

    # Zertifikatspfade
    ssl_certificate /var/lib/acme/grafana.local.my-domain.xyz.crt;
    ssl_certificate_key /var/lib/acme/grafana.local.my-domain.xyz.key;


location = / {
        return 301 https://$host/public-dashboards/410a6089a1d94504b37aaededeb88c21;
    }

    # 2. Das spezifische Dashboard erlauben
    location ^~ /public-dashboards/410a6089a1d94504b37aaededeb88c21 {
        proxy_pass https://192.168.1.115:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Notwendige System-Pfade für das Grafana-Frontend (JS, CSS, Bilder)
    location ~ ^/(public/|api/public/|api/live/|api/datasources/proxy/) {
        proxy_pass https://192.168.1.115:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Alles andere (Sicherheits-Fallback) blockieren
    # Hier landen alle Anfragen, die nicht exakt / , das Dashboard oder die Assets sind
    location / {
        return 403;
    }

    # Optional: Logging
    access_log /var/log/nginx/grafana.my-domain.xyz.access.log;
    error_log /var/log/nginx/grafana.my-domain.xyz.error.log;
}
