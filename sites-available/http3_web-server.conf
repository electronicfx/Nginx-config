# Map-Block für korrekte WebSocket + Keepalive
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

upstream default {
    server 10.0.0.2:8080;
    server [fd00:cafe:1::2]:8080;
    keepalive 32;
}

server {
    if ($host = bw.my-domain.xyz) {
        return 301 https://$host$request_uri;
    } 
    listen 192.168.1.55:80;
    listen [::]:80;
    server_name bw.my-domain.xyz;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 192.168.1.55:443 ssl;
    listen 192.168.1.55:443 quic;
    
    listen [::]:443 ssl;
    listen [::]:443 quic;
    
    http2 on;
    http3 on;

    server_name bw.my-domain.xyz;
 
    ssl_certificate /etc/letsencrypt/live/bw.my-domain.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bw.my-domain.xyz/privkey.pem;

# waf
    /etc/nginx/waf/actions/waf_rules.conf;

# SSL/TLS Modern Configuration
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    quic_retry on;

    client_max_body_size 525M;

    location / {
        proxy_pass http://default;

       # proxy_ssl_verify off;
       # proxy_ssl_server_name on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

	## Standard Security Headers
	#    add_header X-Frame-Options "SAMEORIGIN" always;
	#    add_header X-Content-Type-Options "nosniff" always;
    }

    location /admin {
        deny all;
    }

    # Access List (Example)
#    allow all;
    allow 10.0.0.3;
    allow 1.2.3.4; # DYN_IP
    allow 2a02:3100::; # DYN_IP_V6
    deny all;

    # Optional: Logging
    access_log /var/log/nginx/bw.access.log;
    error_log /var/log/nginx/bw.error.log debug;

}
