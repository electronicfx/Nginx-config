server {
    listen 443 ssl;
    server_name rss.my-domain.xyz;

    # 1. Normale SSL-Zertifikate von acme.sh (Beispielpfade anpassen!)
    ssl_certificate /var/lib/acme/rss.my-domain.xyz.crt;
    ssl_certificate_key /var/lib/acme/rss.my-domain.xyz.key;

    # 2. Client-Zertifikat Prüfung aktivieren
    ssl_client_certificate /etc/nginx/clientcert/myCA.crt;
    ssl_verify_client on; 

    location / {
        proxy_pass http://192.168.1.22:8081; # FreshRSS IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Wichtig für greader.php (Google Reader API)
        proxy_redirect off;
    }
}
