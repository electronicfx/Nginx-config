## Enhanced DoH NGINX Configuration for Home Setup
# Supports HTTP/2, strong TLS settings, OCSP stapling, HSTS, minimal logging

server {
    listen 443 ssl;
    http2 on;
    server_name doh.my-domain.xyz;

    # TLS certificate and key
    ssl_certificate     /var/lib/acme/doh.my-domain.xyz.crt;
    ssl_certificate_key /var/lib/acme/doh.my-domain.xyz.key;

    # Strong TLS settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /home/nginx/.acme.sh/doh.my-domain.xyz_ecc/ca.cer;

    resolver 192.168.1.28 valid=300s;
    resolver_timeout 5s;


    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Minimal logging: disable access logs, keep error logs to warn+ only
    access_log off;
    error_log  /var/log/nginx/doh_error.log warn;

    # Default limits
    client_max_body_size 1m;
    keepalive_timeout     60;

# Verbindungs- und Requestlimits aktivieren
    limit_conn doh_conn 6;
    limit_req zone=doh_limit burst=40 nodelay;


    # DNS-over-HTTPS endpoint
    ## prtoxy pass to adguard
    location = /dns-query {
        proxy_pass https://192.168.1.28:8443/dns-query;
        proxy_ssl_verify off;    # internal AdGuard certificate trust off

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Accept        application/dns-message;
        proxy_set_header Content-Type  application/dns-message;

        limit_conn doh_conn 2;
        limit_req zone=doh_limit burst=10 nodelay;
        limit_req_status 429;

    }

    # Health check endpoint (optional)
    location = /health {
        return 204;
    }

}
