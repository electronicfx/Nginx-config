# Default catch-all Server (für alle unbekannten Domains)
## teseten mit -> curl -I -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0" http://localhost
## curl -I -A "Googlebot" http://localhost

map $http_user_agent $is_bot {
    default 0;
    ~*bot 1;
    ~*crawler 1;
    ~*spider 1;
    ~*scraper 1;
    ~*googlebot 1;
    ~*bingbot 1;
    ~*slurp 1;
    ~*duckduckbot 1;
    ~*facebookexternalhit 1;
    ~*twitterbot 1;
    ~*linkedinbot 1;
    ~*whatsapp 1;
    ~*telegram 1;
}

# 1. Default HTTP Server
server {
    listen 192.168.1.55:80 default_server;
    server_name _;

    # Wenn es ein Bot ist, schicke ihn in die Schleife
    if ($is_bot) {
        rewrite ^(.*)$ /loop/ permanent;
    }

    location /loop/ {
        # Die Schleife: Leitet immer wieder auf sich selbst um
        # Der Browser/Bot sieht: /loop/ -> /loop/loop/ -> /loop/loop/loop/ ...
        rewrite ^(.*)$ $1/loop/ permanent;
        
        # Alternativ: Nach X Schritten auf das 10GB File werfen
        # Da Nginx intern Limits hat, wird dies nach ca. 10 Redirects 
        # oft mit einem 500er Fehler enden, außer wir nutzen externe URLs:
        error_page 500 =301 https://speed.hetzner.de/10GB.bin;
    }

    location / {
        return 301 http://0.0.0.0;
    }

  # Optional: Logging
    access_log /var/log/nginx/default-acces.log;
    error_log /var/log/nginx/default-error.log;

#    return 444; # Für normale User/Scanner ohne Bot-UA
}

# 2. Default HTTPS Server
server {
    listen 192.168.1.55:443 ssl default_server;
    server_name _;

    ssl_certificate  /var/lib/acme/my-domain.xyz.crt;
    ssl_certificate_key  /var/lib/acme/my-domain.xyz.key;

    if ($is_bot) {
        # Direkte Endlosschleife auf eine sich verändernde URL
        rewrite ^ /loop$request_uri permanent;
    }

    location /loop {
        # Erzeugt URLs wie /loop/loop/loop...
        rewrite ^(.*)$ $1/loop permanent;
    }

    # Falls die Rekursionstiefe von Nginx erreicht wird (Standard 10)
    error_page 500 =301 https://speed.hetzner.de/10GB.bin;

    location / {
        return 301 http://0.0.0.0;
    }
  # Optional: Logging
    access_log /var/log/nginx/default-acces.log;
    error_log /var/log/nginx/default-error.log;

#    return 444;
}

server {rewrite ^(/.well-known/acme-challenge/.*) $1 break; # managed by Certbot

rewrite ^(/.well-known/acme-challenge/.*) $1 break; # managed by Certbot


    listen 192.168.1.55:80 ;
