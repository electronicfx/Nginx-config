## anfragen von dns-srv.org werden auf das backend weitergeleitet // keine weitere port freigabe nötig
server {
    listen 80;
    listen [::]:80;
    server_name dns-srv.org *.dns-srv.org;

    location / {
        proxy_pass         http://192.168.5.50:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;   # hier $scheme = "http"
    }
}

server {
    listen 443 ssl; 
    http2 on;
    server_name dns-srv.org *.dns-srv.org;

    # ─────────  Wildcard- oder SAN-Zertifikat für dns-srv.org  ─────────
    ssl_certificate     /var/lib/acme/bitwarden.dns-srv.org.crt;
    ssl_certificate_key /var/lib/acme/bitwarden.dns-srv.org.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass             https://192.168.5.50:443;
        proxy_ssl_server_name  on;            # aktiviert SNI, damit Backend das richtige Cert wählt
        proxy_ssl_verify       off;           # wenn das Backend-Cert selbstsigniert ist
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;   # gibt an, dass der Client per TLS kam
    }
}
