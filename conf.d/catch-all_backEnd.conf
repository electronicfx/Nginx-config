###############################################
#  /etc/nginx/sites-enabled/catch-all.conf
#  Backend: Host-Header → interner Dienst-Port
###############################################

# 1) Map von Host → Backend-Port
map $host $svc_port {
#    default                 8080;      # Fallback (z. B. Vaultwarden)
    bitwarden.dns-srv.org   8080;
    grafana.dns-srv.org     3000;
    paperless.dns-srv.org   8000;
    # … weitere Hosts/Ports einfach anfügen …
}

# 2) HTTP-Listener (kommt, wenn Front-NGINX HTTP durchreicht)
server {
    listen 80;
    listen [::]:80;
    server_name _;    # Catch-All

    location / {
        proxy_pass         http://127.0.0.1:$svc_port;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;   # hier = "http"
    }
}

# 3) HTTPS-Listener (kommt, wenn Front-NGINX HTTPS durchreicht)
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name _;    # Catch-All

    ssl_certificate     /var/lib/acme/dns-srv.org.crt;
    ssl_certificate_key /var/lib/acme/dns-srv.org.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://127.0.0.1:$svc_port;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;   # da der Ursprungs-Client TLS hatte
    }
}
