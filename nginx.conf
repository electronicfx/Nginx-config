pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
include /etc/nginx/modules-enabled/*.conf;

quic_bpf on;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

stream {
        # DoT etc
        include /etc/nginx/stream.d/*.conf;
}


http {
    resolver 192.168.1.28 [2620:fe::9] valid=90s;
    resolver_timeout 5s;

    # rate limiting
    limit_req_zone $binary_remote_addr zone=bw:80m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=doh_limit:16m rate=80r/s;
    limit_conn_zone $binary_remote_addr zone=doh_conn:16m;


    # QUIC-Debug aktivieren
    error_log /var/log/nginx/quick-error.log warn;

    # QUIC-Parameter optimieren
    quic_retry on;
    quic_gso on;  # falls verfügbar
  
    quic_host_key /etc/nginx/quic_host.key;


    ##
    # Basic Settings
    ##

    ## Waf
    include /etc/nginx/waf/nginx/map/waf_maps.conf;

    sendfile on;
    tcp_nopush on;  # Kann aktiviert werden, je nach Bedarf
    types_hash_max_size 2048;
    server_tokens off;  # Verhindert das Senden der Nginx-Version in den HTTP-Headern

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # SSL Settings
    ##
    ssl_protocols TLSv1.3;  # TLSv1.2 und TLSv1.1 entfernen
    ssl_prefer_server_ciphers on;

    ##
    # Logging Settings
    ##

root@nginx:/home/nginx/nginx/sites-available# systemctl reload nginx
root@nginx:/home/nginx/nginx/sites-available# systemctl restart nginx
root@nginx:/home/nginx/nginx/sites-available# cat ../nginx.conf
user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
include /etc/nginx/modules-enabled/*.conf;

# QUIC: eBPF-Routing fuer Verbindungsmigration
# (braucht --with-http_v3_module, Kernel mit eBPF und root bzw. CAP_BPF/CAP_NET_ADMIN)
quic_bpf on;

events {
    worker_connections 4096;
}

stream {
    # DoT, DoQ etc.
    include /etc/nginx/stream.d/*.conf;
}

http {
    ##
    # Resolver
    ##
    # Hinweis: nginx nutzt mehrere Resolver per Round-Robin, nicht als Fallback.
    # Wenn der lokale Resolver interne Namen aufloest, ggf. Quad9 entfernen.
    resolver 192.168.1.28 [2620:fe::9] valid=90s;
    resolver_timeout 5s;

    ##
    # Rate limiting (Zonen NUR hier definieren, nicht in den Server-Dateien)
    ##
    limit_req_zone  $binary_remote_addr zone=bw:20m        rate=40r/s;
    limit_req_zone  $binary_remote_addr zone=doh_limit:16m rate=80r/s;
    limit_conn_zone $binary_remote_addr zone=doh_conn:16m;

    ##
    # QUIC / HTTP/3 (global, in den Server-Bloecken nicht wiederholen)
    ##
    error_log /var/log/nginx/quic-error.log info;

    quic_retry on;
    quic_gso on;         
    quic_host_key /etc/nginx/quic_host.key;

    ##
    # WAF
    ##
    include /etc/nginx/waf/nginx/map/waf_maps.conf;

    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 10m;    # global klein; Server mit Uploads (z. B. bw) setzen ihren eigenen Wert

    ##
    # SSL Settings (einmal global, in den Server-Bloecken NICHT wiederholen)
    ##
    ssl_protocols TLSv1.3;                  # QUIC verlangt TLS 1.3
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_early_data off;                     # 0-RTT aus (Replay-Risiko)

    ##
    # Logging
    ##
    map $http_user_agent $loggable {
        ~*pulse-host-agent    0;
        ~*pulse-docker-agent  0;
        default               1;
    }

    # Nur Fehler loggen (4xx/5xx), z. B. fuer DoH: access_log ... json_loki if=$log_errors;
    map $status $log_errors {
        ~^[45]  1;
        default 0;
    }

    log_format json_loki escape=json '{'
        '"time": "$time_iso8601", '
        '"remote_addr": "$remote_addr", '
        '"status": "$status", '
        '"request": "$request", '
        '"protocol": "$server_protocol", '
        '"request_time": "$request_time", '
        '"http_referrer": "$http_referer", '
        '"http_user_agent": "$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_loki if=$loggable;

    ##
    # Gzip Settings
    ##
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    ##
    # Virtual Host Configs
    ##
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
