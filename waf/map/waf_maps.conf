##   include /etc/nginx/waf/nginx/map/waf_maps.conf;     # in http { }
##   include /etc/nginx/waf/nginx/rules/waf_rules.conf;  # in server { }

## Funktionsweise
##   1. $waf_skip   - Pfade, die nie geprueft werden (API, Statik, ...)
##   2. $waf_hit    - EINE Map, die den Request einmal prueft und den Namen
##                    der ersten getroffenen Regel liefert ("" = kein Treffer)
##   3. $waf_block  - 1 nur wenn Treffer UND $waf_enforce = 1
##   4. $waf_log    - 1 bei jedem Treffer (auch im Detect-Modus) -> waf.log

## Wichtig:
##   * Regex-Backslashes stehen mit EINEM "\" (nginx entfernt nur \\ und \").
##   * Map-Regeln: die ERSTE passende Regel gewinnt (Reihenfolge = Prioritaet).

## Betriebsmodus:  1 = blocken,  0 = nur loggen (Detect-Only, zum Tunen)

map $host $waf_enforce {
    default 1;
}

## 1 Pfade, die NICHT geprueft werden
##   (API + Identity + Icons + Websocket + Statik)

map $request_uri $waf_skip {
    default 0;
    "~^/(?:\?.*)?$"                                                  1;
    "~^/(?:api|identity|icons|notifications|alive|sends?)(?:/|\?|$)"  1;
    "~^/(?:app|css|js|images|fonts|locales|vw_static|assets)/"         1;
    "~^/\.well-known/"                                                1;
    "~^/dns-query(?:/|\?|$)"                                          1;   # DoH: eigene strikte Pruefung (unten)
    "~^/[A-Za-z0-9_.-]+\.(?:js|css|png|ico|svg|webp|woff2?|ttf|map|json|html)(?:\?.*)?$" 1;
}


## 2  Regel-Engine: liefert den Namen der ersten getroffenen Regel
##    Key = "<skip>:<request_uri>"; bei skip=1 sofort Ende ohne weitere Regex

map "$waf_skip:$request_uri" $waf_hit {
    default "";
    "~^1:"  "";

    "~*^0:[^?]*\.(?:php[0-9]?|phtml|phar|jspx?|aspx?|cgi|sql|bak|swp|env|ini|conf|cfg)(?:/|\?|$)" probe-ext;
    "~*^0:[^?]*/\.(?:git|svn|hg|env|aws|ssh|docker|npmrc|htaccess|htpasswd|ds_store|bash_history|idea|vscode)" probe-dot;
    "~*^0:/(?:wp-(?:admin|login|content|includes|json)|xmlrpc|phpmyadmin|pma/|cgi-bin|phpunit|boaform|actuator|solr/|jenkins|manager/html|hudson|owa/|ecp/|autodiscover)" probe-path;
    "~*(?:\.\.|%2e%2e|%2e\.|\.%2e)(?:/|%2f|%5c)" lfi-traversal;
    "~*(?:/|%2f)(?:etc(?:/|%2f)(?:passwd|shadow|group|hosts)|proc(?:/|%2f)self|windows(?:/|%2f)win\.ini)|boot\.ini" lfi-files;
    "~*(?:\$|%24)(?:\{|%7b)" rce-expr;
    "~*(?:\{\{|%7b%7b).{0,100}?(?:\}\}|%7d%7d)" ssti;
    "~*(?:;|%3b|\||%7c|%60|`|%24%28|\$\(|&&|%26%26)(?:\+|%20|%09|%0a|/\*[^*]*\*/)*(?:cat|ls|id|whoami|uname|wget|curl|nc|ncat|bash|sh|python[23]?|perl|php|powershell|cmd|chmod|rm|echo)(?:(?:\+|%20|%09|%0a|/\*[^*]*\*/)|/|%2f|;|%3b|\||%7c|\)|%29|`|%60|$)" rce-shell;
    "~*(?:/|%2f)bin(?:/|%2f)(?:ba|da|z|c|k)?sh|cmd(?:\.exe)?(?:\+|%20|%09|%0a|/\*[^*]*\*/)+(?:/c|%2fc)|powershell(?:\.exe)?(?:\+|%20|%09|%0a|/\*[^*]*\*/)+|/dev/(?:tcp|udp)/" rce-path;
    "~*union(?:\+|%20|%09|%0a|/\*[^*]*\*/)+(?:all(?:\+|%20|%09|%0a|/\*[^*]*\*/)+)?select" sqli-union;
    "~*select(?:\+|%20|%09|%0a|/\*[^*]*\*/)+[^&]{1,200}?(?:\+|%20|%09|%0a|/\*[^*]*\*/)+from(?:\+|%20|%09|%0a|/\*[^*]*\*/)+" sqli-select;
    "~*(?:%27|'|%22|\x22|`)(?:\+|%20|%09|%0a|/\*[^*]*\*/)*(?:or|and|xor)(?:\+|%20|%09|%0a|/\*[^*]*\*/)+[^&=]{1,40}?(?:\+|%20|%09|%0a|/\*[^*]*\*/)*(?:=|%3d|like|<|>|%3c|%3e)" sqli-quote;
    "~*[0-9](?:\+|%20|%09|%0a|/\*[^*]*\*/)+(?:or|and)(?:\+|%20|%09|%0a|/\*[^*]*\*/)+[0-9]+(?:\+|%20|%09|%0a|/\*[^*]*\*/)*(?:=|%3d|%3c|%3e|<|>)" sqli-bool;
    "~*(?:sleep|benchmark|pg_sleep|extractvalue|updatexml|load_file)(?:\(|%28)" sqli-func;
    "~*information_schema|sqlite_master|xp_cmdshell|sp_executesql|@@version|waitfor(?:\+|%20|%09|%0a|/\*[^*]*\*/)+delay|into(?:\+|%20|%09|%0a|/\*[^*]*\*/)+(?:out|dump)file" sqli-meta;
    "~*(?:;|%3b)(?:\+|%20|%09|%0a|/\*[^*]*\*/)*(?:drop|alter|truncate|insert|update|delete|create|exec|shutdown|select)(?:\+|%20|%09|%0a|/\*[^*]*\*/)+" sqli-stack;
    "~*(?:%27|'|%22|\x22|`)(?:\+|%20|%09|%0a|/\*[^*]*\*/)*(?:--|%2d%2d|%23|#|/\*)" sqli-comment;
    "~*(?:<|%3c|%253c)(?:/|%2f)?(?:script|img|svg|iframe|object|embed|body|link|meta|style|base|form|input|video|audio|details|marquee)" xss-tag;
    "~*(?:javascript|vbscript)(?::|%3a)" xss-proto;
    "~*[^a-z]on(?:error|load|click|dblclick|mouse[a-z]+|focus[a-z]*|blur|key[a-z]+|change|submit|toggle|start|finish|pointer[a-z]+|animation[a-z]+|transition[a-z]+|input|drag[a-z]*|drop)(?:\+|%20|%09|/)*(?:=|%3d)" xss-handler;
    "~*document(?:\.|%2e)(?:cookie|write|location|domain)|window(?:\.|%2e)location|(?:eval|alert|prompt|confirm)(?:\(|%28)|String(?:\.|%2e)fromCharCode" xss-js;
    "~*%00|%0d%0a|%0a%0d|%25(?:00|0d|0a)|%c0%af|%e0%80%af" proto-ctl;
    "~*(?:=|%3d)(?:file|ftps?|gopher|dict|ldap|tftp|jar|netdoc)(?::|%3a)(?://|%2f%2f)|(?:php|phar|expect|zip|glob)(?::|%3a)(?://|%2f%2f)" rfi-scheme;
    "~*(?:=|%3d)https?(?::|%3a)(?://|%2f%2f)(?:[0-9]{1,3}\.){3}[0-9]{1,3}|169\.254\.169\.254|metadata\.google\.internal" rfi-ip;
}


## 3 Entscheidung

map "$waf_enforce:$waf_hit" $waf_block {
    default 1;
    "~^0:"   0;     # Detect-Only -> nie blocken
    "~:$"    0;     # kein Treffer
}

## 4 DoH mit Token im Pfad:  /dns-query/<token>
##    Erlaubt ist NUR:
##      GET  /dns-query/<token>?dns=<base64url>    (16-2048 Zeichen, optional '=' Padding)
##      POST /dns-query/<token>   mit Content-Type: application/dns-message
##    Alles andere unter /dns-query (kein/ungueltiges Token, andere Methode,
##    fremde Parameter, falscher Content-Type, ...) -> $doh_invalid = 1
##    Key = "<Methode>:<Content-Type>:<request_uri>"   (case-sensitive: Token ist lowercase)

map "$request_method:$http_content_type:$request_uri" $doh_invalid {
    default 0;       # nicht-DoH-Pfade bleiben unberuehrt

    # --- erlaubt -------------------------------------------------------
    "~^GET:[^:]*:/dns-query/[a-z2-7]{26}\?dns=[A-Za-z0-9_-]{16,2048}(?:=|%3[dD]){0,2}$"   0;
    "~^POST:application/dns-message(?:;[^:]*)?:/dns-query/[a-z2-7]{26}$"                  0;

    # --- alles andere unter /dns-query ----------------------------------
    "~*^[^:]*:[^:]*:/dns-query(?:[/?]|$)"                                                 1;
}


## 4-1 Token gegen Allowlist pruefen 

map $request_uri $doh_token {
    default "";
    "~^/dns-query/(?<tok>[a-z2-7]{26})(?:\?|$)"   $tok;
}

map "$doh_token:$doh_token_ok" $doh_unknown_token {
    default 0;
    "~^[a-z2-7]{26}:0$"   1;
}

map "$waf_enforce:$doh_invalid$doh_unknown_token" $doh_block {
    default 0;
    "~^1:(?:1[01]|01)$"   1;
}

## 5 Logging: jeder Treffer (WAF-Regel oder DoH-Verstoss), auch im Detect-Modus

map $request_uri $waf_log_uri {
    default            $request_uri;
    "~^/dns-query"     "/dns-query/<masked>";   # Token + dns= (Domain) nie loggen
}

## Hauptlog: DoH-Requests (Token + Domain) NICHT loggen, auch nicht abgewiesene.
## Verwendung:  access_log /var/log/nginx/access.log combined if=$access_log_ok;

map $request_uri $access_log_ok {
    default 1;
    "~^/dns-query"   0;
}

map "$waf_hit$doh_invalid$doh_unknown_token" $waf_log {
    default 1;
    "00"    0;
}


log_format waf_log '$remote_addr [$time_local] "$request_method $host$waf_log_uri" '
                   'rule=$waf_hit doh_invalid=$doh_invalid/$doh_unknown_token enforce=$waf_enforce blocked=$waf_block/$doh_block ua="$http_user_agent"';
